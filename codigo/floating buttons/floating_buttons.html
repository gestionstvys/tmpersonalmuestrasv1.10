<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botones Flotantes - Redes Sociales</title>
    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="../img/logos/Icono_tmp.png">
    <!-- Tipografía Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Enlace al archivo CSS de los botones flotantes -->
    <link rel="stylesheet" href="floating_buttons.css">
</head>
<body>

    <!-- CONTENIDO DE PRUEBA -->
    <main style="padding: 40px; color: #171A20; text-align: center; min-height: 100vh;">
        <h1>Pila de Botones Flotantes (Redes Sociales)</h1>
        <p>Mira la esquina inferior derecha de la pantalla para ver los botones flotantes de TikTok, Instagram y Facebook.</p>
    </main>

    <!-- ==========================================
         PILA DE BOTONES FLOTANTES DE REDES SOCIALES
         ========================================== -->
    <div class="button-stack">
        
        <!-- TikTok -->
        <div class="btn-wrapper">
            <a href="https://www.tiktok.com" target="_blank" rel="noopener noreferrer" class="orb-btn btn-tiktok" aria-label="TikTok">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.04-.5z"></path>
                </svg>
            </a>
            <span class="btn-label">TikTok</span>
        </div>

        <!-- Instagram -->
        <div class="btn-wrapper">
            <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" class="orb-btn btn-instagram" aria-label="Instagram">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
            </a>
            <span class="btn-label">Instagram</span>
        </div>

        <!-- Facebook (FB) -->
        <div class="btn-wrapper">
            <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer" class="orb-btn btn-facebook" aria-label="Facebook">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
                </svg>
            </a>
            <span class="btn-label">Facebook</span>
        </div>

    </div>

    <!-- Enlace al archivo JavaScript -->
    <script src="floating_buttons.js"></script>
</body>
</html>
